# A chain package. It lists the libraries it imports, as wide version ranges, so it can be
# installed in any project. The repo-root pyproject.toml installs it and its single
# poetry.lock picks one exact version of everything. Never lock or install from this folder.
[project]
name = "my-app"
version = "0.0.1"
description = "A small chain that answers like a pirate"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "pydantic>=2,<3",
    "python-dotenv>=1,<2",
]

[tool.poetry]
packages = [{ include = "my_app" }]

[tool.langserve]
export_module = "my_app"
export_attr = "chain"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
