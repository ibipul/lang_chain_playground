[build-system]
requires = [ "poetry-core",]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "my-app"
version = "0.0.1"
description = ""
authors = []
readme = "README.md"

[tool.langserve]
export_module = "my_app"
export_attr = "chain"

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
# Shared LangChain stack: keep this block identical in my-app, my-assistant and my-language
langchain-core = "^1.6.12"
langchain = "^1.4.6"
langchain-openai = "^1.7.2"
langsmith = "^0.14.11"
python-dotenv = "^1.2.4"
langserve = "^0.3.3"

[tool.poetry.group.dev.dependencies]
# Same versions my-language resolves, so every project's lock agrees
fastapi = "^0.156.5"
sse-starlette = "^1.8.2"
pytest = "^9.0.1"
typer = "^0.20.0"
click = "^8.3.1"
langchain-cli = ">=0.0.37"
