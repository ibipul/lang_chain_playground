# Package metadata only, so this folder installs as a Python package.
# Dependencies live in the repo-root pyproject.toml, not here.
[project]
name = "my-app"
version = "0.0.1"
description = "A small chain that answers like a pirate"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.poetry]
packages = [{ include = "my_app" }]

[tool.langserve]
export_module = "my_app"
export_attr = "chain"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
