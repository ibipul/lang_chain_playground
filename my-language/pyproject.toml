[tool.poetry]
name = "my-language"
version = "0.1.0"
description = ""
authors = ["ibipul <islam.bipul@gmail.com>"]
readme = "README.md"
packages = [
    { include = "app" },
]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
# Shared LangChain stack: keep this block identical in my-app, my-assistant and my-language
langchain-core = "^1.6.12"
langchain = "^1.4.6"
langchain-openai = "^1.7.2"
langsmith = "^0.14.11"
langserve = {extras = ["server"], version = "^0.3.3"}
uvicorn = "^0.54.0"
pydantic = "^2.0"

# Local package, relative to this folder
my-assistant = {path = "packages/my-assistant", develop = true}


[tool.poetry.group.dev.dependencies]
# FIX THE BROKEN CLI
langchain-cli = ">=0.0.37"
# langchain-cli allows typer 0.9, which breaks on click 8.2+ and lacks rich; use a current one
typer = "^0.20.0"
pytest = "^9.0.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
