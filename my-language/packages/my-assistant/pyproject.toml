[build-system]
requires = [ "poetry-core",]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "my-assistant"
version = "0.0.1"
description = ""
authors = []
readme = "README.md"

[tool.langserve] #<<-- update if you update chain tool name or module
export_module = "my_assistant"
export_attr = "chain" 

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
# Shared LangChain stack: keep this block identical in my-app, my-assistant and my-language
langchain-core = "^1.6.12"
langchain = "^1.4.6"
langchain-openai = "^1.7.2"
langsmith = "^0.14.11"
langserve = "^0.3.3"
langchain-community = "^0.4.2"
faiss-cpu = "^1.12.0"

[tool.poetry.group.dev.dependencies]
# Same versions my-language resolves, so every project's lock agrees
fastapi = "^0.156.5"
sse-starlette = "^1.8.2"
pytest = "^9.0.1"
typer = "^0.20.0"
click = "^8.3.1"
