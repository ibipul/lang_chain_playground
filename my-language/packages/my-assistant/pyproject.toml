# Package metadata only, so this folder installs as a Python package.
# Dependencies live in the repo-root pyproject.toml, not here.
[project]
name = "my-assistant"
version = "0.0.1"
description = "Mark Anthony role-play chain, served by my-language at /assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.poetry]
packages = [{ include = "my_assistant" }]

[tool.langserve]
export_module = "my_assistant"
export_attr = "chain"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
