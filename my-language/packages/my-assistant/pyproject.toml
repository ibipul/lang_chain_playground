# A chain package. It lists the libraries it imports, as wide version ranges, so it can be
# installed in any project. The repo-root pyproject.toml installs it and its single
# poetry.lock picks one exact version of everything. Never lock or install from this folder.
[project]
name = "my-assistant"
version = "0.0.1"
description = "Mark Anthony role-play chain, served by my-language at /assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "langchain-community>=0.4,<0.5",
    "faiss-cpu>=1.12,<2",
    "pydantic>=2,<3",
    "python-dotenv>=1,<2",
]

[tool.poetry]
packages = [{ include = "my_assistant" }]

[tool.langserve]
export_module = "my_assistant"
export_attr = "chain"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
